# Source-to-bronze contract. Silver/gold sections are reserved for the later
# PySpark ETL wheel.
version: "1.0"
name: electricity_maps_electricity_mix
domain: energy
description: Latest electricity generation mix by Electricity Maps zone.

source:
  name: electricity_maps
  kind: rest_api
  base_url: https://api.electricitymaps.com/v4/
  auth:
    type: api_key
    name: auth-token
    location: header
    secret_key: sources.electricity_maps.api_key
  resources:
    - name: electricity_mix_latest
      path: electricity-mix/latest
      method: GET
      paginator: single_page
      response_mode: object
      params:
        zone:
          type: values
          values:
            - DE
            - FR
            - NL
            - BE
            - AT
            - PL
            - ES
            - IT
            - GB
            - SE

# Raw JSON files in a Unity Catalog volume (no table).
landing_zone:
  catalog: nxp
  schema: landing
  volume: raw
  file_format: jsonl
  prefix: electricity_mix_latest
  retention_days: 7

# Parsed bronze table in nxp.bronze: ingest timestamp, request URL, raw JSON payload.
# Partitioned by ingest time as year=YYYY/month=MM/day=DD.
bronze:
  catalog: nxp
  schema: bronze
  table: electricity_mix_latest
  destination: databricks
  write_disposition: append
  file_format: parquet
  table_format: delta
  table_comment: Bronze snapshot of the raw Electricity Maps payload.
  partition_by:
    - year
    - month
    - day

keys:
  business_keys:
    - zone
    - datetime

schema:
  columns:
    - name: extracted_at
      data_type: timestamp
      nullable: false
      description: UTC timestamp of this ingest.
    - name: source_url
      data_type: text
      nullable: false
      description: API URL used to fetch this payload.
    - name: payload
      data_type: text
      nullable: false
      description: Raw API JSON for one zone. Not expanded in bronze.
    - name: year
      data_type: text
      nullable: false
      description: UTC year of extracted_at (ingest time). Partition column.
    - name: month
      data_type: text
      nullable: false
      description: UTC month of extracted_at, zero-padded (ingest time). Partition column.
    - name: day
      data_type: text
      nullable: false
      description: UTC day of extracted_at, zero-padded (ingest time). Partition column.

layers:
  silver:
    catalog: nxp
    schema: silver
    table: fact_electricity_mix
    path: /Volumes/nxp/silver/fact_electricity_mix
    write_disposition: merge
    partition_by:
      - year
      - month
      - day
    tables:
      - name: fact
        table: fact_electricity_mix
        path: /Volumes/nxp/silver/fact_electricity_mix
        merge_keys:
          - zone
          - datetime
      - name: dim_zone
        table: dim_zone
        path: /Volumes/nxp/silver/dim_zone
        partition_by: []
        merge_keys:
          - zone
      - name: dim_date
        table: dim_date
        path: /Volumes/nxp/silver/dim_date
        partition_by: []
        merge_keys:
          - dt
  gold:
    catalog: nxp
    schema: gold
    table: electricity_mix_daily_relative
    path: /Volumes/nxp/gold/electricity_mix_daily_relative
    partition_by:
      - dt
