bundle:
  name: electricity_etl

include:
  - resources/jobs/*.yml

artifacts:
  electricity_etl:
    type: whl
    build: poetry build
    path: ./electricity_etl
    dynamic_version: true

sync:
  include:
    - ./contracts/**
  exclude:
    - .venv
    - electricity_etl/.venv
    - electricity_etl/output
    - electricity_etl/dist
    - "**/.venv/**"
    - "**/__pycache__/**"

# Change this host to YOUR workspace before bundle deploy or GitHub Actions.
# Example: https://dbc-xxxxxxxx-xxxx.cloud.databricks.com
workspace:
  host: https://dbc-81265a1a-0ee9.cloud.databricks.com

targets:
  dev:
    mode: production
    default: true
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
