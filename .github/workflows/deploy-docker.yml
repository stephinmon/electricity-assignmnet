name: Deploy Docker

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: Build and push ingest + Airflow
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and push images
        uses: ./.github/actions/deploy-docker
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
