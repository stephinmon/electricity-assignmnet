name: Deploy ETL

on:
  workflow_dispatch:
    inputs:
      target:
        description: Databricks bundle target
        type: choice
        options:
          - prod
          - dev
        default: prod
  workflow_call:
    inputs:
      target:
        description: Databricks bundle target
        type: string
        default: prod
    secrets:
      DATABRICKS_HOST:
        required: true
      DATABRICKS_TOKEN:
        required: true

permissions:
  contents: read

env:
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run unit tests
        uses: ./.github/actions/unit-tests

  deploy:
    name: Deploy Databricks ETL job
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy bundle
        uses: ./.github/actions/deploy-etl
        with:
          target: ${{ inputs.target || 'prod' }}
