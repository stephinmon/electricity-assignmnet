name: Deploy ETL

on:
  workflow_dispatch:
    inputs:
      target:
        description: Databricks bundle target
        type: choice
        options:
          - prod
          - dev
        default: prod
  workflow_call:
    inputs:
      target:
        description: Databricks bundle target
        type: string
        default: prod
    outputs:
      job_id:
        description: Deployed Databricks job id
        value: ${{ jobs.deploy.outputs.job_id }}
      job_name:
        description: Deployed Databricks job name
        value: ${{ jobs.deploy.outputs.job_name }}
    secrets:
      DATABRICKS_HOST:
        required: true
      DATABRICKS_TOKEN:
        required: true

permissions:
  contents: read

env:
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

jobs:
  deploy:
    name: Deploy Databricks ETL job
    runs-on: ubuntu-latest
    outputs:
      job_id: ${{ steps.bundle.outputs.job_id }}
      job_name: ${{ steps.bundle.outputs.job_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy bundle
        id: bundle
        uses: ./.github/actions/deploy-etl
        with:
          target: ${{ inputs.target || 'prod' }}
