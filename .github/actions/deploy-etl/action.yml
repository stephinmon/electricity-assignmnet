name: Deploy Databricks ETL
description: Deploy the electricity_etl Databricks Asset Bundle (job name electricity-etl).

inputs:
  target:
    description: Bundle target (prod or dev)
    required: false
    default: prod

runs:
  using: composite
  steps:
    - name: Check Databricks secrets
      shell: bash
      run: |
        if [ -z "${DATABRICKS_HOST:-}" ] || [ -z "${DATABRICKS_TOKEN:-}" ]; then
          echo "Set DATABRICKS_HOST and DATABRICKS_TOKEN." >&2
          exit 1
        fi

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Poetry
      shell: bash
      run: pipx install poetry==1.8.5

    - name: Install Databricks CLI
      uses: databricks/setup-cli@main

    - name: Deploy bundle
      shell: bash
      run: |
        databricks bundle validate -t "${{ inputs.target }}"
        databricks bundle deploy -t "${{ inputs.target }}"
