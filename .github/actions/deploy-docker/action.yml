name: Build and push Docker images
description: Build and push ingest and Airflow images to GHCR.

inputs:
  github_token:
    description: Token used to push to GHCR
    required: true

outputs:
  ingest_image:
    description: Pushed ingest image reference
    value: ${{ steps.image.outputs.ingest }}:${{ steps.image.outputs.tag }}
  airflow_image:
    description: Pushed Airflow image reference
    value: ${{ steps.image.outputs.airflow }}:${{ steps.image.outputs.tag }}

runs:
  using: composite
  steps:
    - name: Lowercase image prefix
      id: image
      shell: bash
      run: |
        prefix="$(echo "ghcr.io/${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
        echo "ingest=${prefix}/ingest" >> "$GITHUB_OUTPUT"
        echo "airflow=${prefix}/airflow" >> "$GITHUB_OUTPUT"
        echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github_token }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push ingest
      uses: docker/build-push-action@v6
      with:
        context: .
        file: Dockerfile
        push: true
        platforms: linux/amd64,linux/arm64
        tags: |
          ${{ steps.image.outputs.ingest }}:${{ steps.image.outputs.tag }}
          ${{ steps.image.outputs.ingest }}:latest

    - name: Build and push Airflow
      uses: docker/build-push-action@v6
      with:
        context: ./airflow
        file: ./airflow/Dockerfile
        push: true
        platforms: linux/amd64,linux/arm64
        tags: |
          ${{ steps.image.outputs.airflow }}:${{ steps.image.outputs.tag }}
          ${{ steps.image.outputs.airflow }}:latest

    - name: Write compose env
      shell: bash
      run: |
        cat > docker-deploy.env <<EOF
        INGEST_IMAGE=${{ steps.image.outputs.ingest }}:${{ steps.image.outputs.tag }}
        AIRFLOW_IMAGE=${{ steps.image.outputs.airflow }}:${{ steps.image.outputs.tag }}
        EOF

    - name: Upload docker-deploy.env
      uses: actions/upload-artifact@v4
      with:
        name: docker-deploy-env
        path: docker-deploy.env
